  <text x="88" y="364" fill="#F5F5F7" font-size="74" font-weight="800" letter-spacing="-2">COLLAPSE</text>
  <text x="88" y="430" fill="#F5F5F7" font-size="29" font-weight="500">Measurement exposes.</text>
  <text x="88" y="465" fill="#F5F5F7" font-size="29" font-weight="500">Preparation pays.</text>
  <text x="88" y="592" fill="#F5F5F7" opacity="0.46" font-size="13" font-weight="500" letter-spacing="0.2">PREPARATION ORDER r  ·  BORN DEGREE &lt;= 2r  ·  NORMALIZATION COUNTS</text>
</g>
